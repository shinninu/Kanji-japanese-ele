<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>かんじ しょうぶ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f4ea;color:#23303f;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;line-height:1.6}
main{max-width:640px;margin:auto;padding:16px}
h1{font-size:26px;margin:4px 0;text-align:center}h2{font-size:17px;margin:20px 0 8px}
button{font:inherit;color:inherit;border:2px solid #23303f;background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;touch-action:manipulation}
button.on{background:#ffd45c;font-weight:bold}
button.go{background:#d9472b;color:#fff;border-color:#d9472b;width:100%;font-size:20px;margin-top:12px}
button.ok{background:#cdebd2}button.ng{background:#f8d3cc}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1 1 130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px;margin:8px 0}
.grid button{padding:4px 0;font-size:20px;border-width:1px;border-radius:8px}
input{font:inherit;padding:6px;border-radius:8px;border:1px solid #888;width:9em}
.card{background:#fff;border-radius:16px;padding:14px;text-align:center;margin:10px 0}
.q{font-size:34px;font-weight:bold}.q.long{font-size:20px}
.t{color:#d9472b;border-bottom:4px solid}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ch button{font-size:19px;min-height:60px}
.pad{display:block;margin:8px auto;background:#fff;border:2px solid #23303f;border-radius:12px;touch-action:none;width:min(100%,300px);aspect-ratio:1}
.msg{min-height:1.6em;text-align:center;font-weight:bold}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.duel{position:fixed;inset:0;display:flex;flex-direction:column;background:#f7f4ea}
.half{flex:1;overflow:auto;padding:8px 12px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.half.top{transform:rotate(180deg);background:#e4eef7}
.half .q{font-size:28px}.half .q.long{font-size:17px}.half .ch button{min-height:48px;font-size:16px;padding:4px}
.mid{border-block:3px solid #23303f;text-align:center;padding:2px}.mid button{padding:2px 12px}
</style></head><body><main id="app"></main>

 G={n,p:0,players:two?[0,1].map(i=>({name:S.names[i]||`${i+1}人目`,qs:two&&all.length>1?all.slice(i*n,(i+1)*n):all.slice(0,n)})):[{name:'',qs:all.slice(0,n)}]};
 G.players.forEach(p=>Object.assign(p,{i:0,ok:0,time:0,miss:[]}));
 if(S.style=='haya'){G={qs:all.slice(0,n),i:0,score:[0,0]};return duel()}
 two?ready():ask();
}
function ready(){
 token++;
 app.innerHTML=`<div class="card"><p class="q">${esc(G.players[G.p].name)}の番</p><p>じゅんびができたら おしてね</p><button class="go" id="go">スタート</button></div>`;
 $('#go').onclick=ask;
}
function ask(){
 token++;
 const P=G.players[G.p],it=P.qs[P.i];let t0=0,done=false,timer;
 app.innerHTML=`<div class="bar"><button id="quit">やめる</button><span>${esc(P.name)} ${P.i+1}/${G.n}</span><b id="clock"></b></div><div id="body"></div><div class="msg" id="msg"></div><div id="after"></div>`;
 $('#quit').onclick=home;
 const my=token,clock=$('#clock'),body=$('#body'),msg=$('#msg'),after=$('#after');
 const begin=()=>{t0=performance.now();if(S.style!='ren')timer=setInterval(()=>{if(my!==token)return clearInterval(timer);clock.textContent=(P.time+(performance.now()-t0)/1000).toFixed(1)+'秒'},100)};
 const stop=()=>{clearInterval(timer);if(t0){P.time+=(performance.now()-t0)/1000;t0=0}};
 const finish=(ok,text,auto)=>{if(done)return;done=true;stop();
  if(ok)P.ok++;else{P.miss.push(it);if(S.style!='ren')P.time+=5}
  msg.textContent=(ok?'⭕ せいかい！ ':'🌱 おしい！ ')+text;
  const next=()=>{P.i++;if(P.i<G.n)ask();else if(S.style=='turn'&&G.p==0){G.p=1;ready()}else result()};
  if(auto&&ok)later(next,900);else{after.innerHTML='<button class="go">つぎへ</button>';after.firstChild.onclick=next}};
 if(S.kind=='yomi'||S.kind=='goi'){
  const c=choices(it,S.style=='turn'&&S.hand&&G.p==1?6:4);
  body.innerHTML=`<div class="card">${qHTML(it)}</div><div class="ch">${c.list.map(x=>`<button>${x}</button>`).join('')}</div>`;
  const bs=[...body.querySelectorAll('.ch button')];
  bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>{x.disabled=true;if(x.textContent==c.a){x.className='ok';x.style.opacity=1}});
   const ok=b.textContent==c.a;if(!ok)b.className='ng';finish(ok,ok?'':`こたえは「${c.a}」`,true)});
  begin();
 }else if(S.kind=='kaki'){
  body.innerHTML=`<div class="card"><div class="q">${it.w.split(it.k).join('<span class="t">□</span>')}</div><div>読み：${it.r}　□の漢字を書こう</div></div><canvas class="pad" width="600" height="600"></canvas><div class="row"><button id="clr">けす</button><button id="show">こたえを見る</button></div>`;
  draw(body.querySelector('canvas'),()=>done);
  body.querySelector('#clr').onclick=()=>{const c=body.querySelector('canvas');c.getContext('2d').clearRect(0,0,600,600)};
  body.querySelector('#show').onclick=e=>{stop();e.target.disabled=true;
   msg.innerHTML=`こたえ <span style="font-size:64px;font-family:'UD デジタル 教科書体 N-R','YuKyokasho',serif">${it.k}</span>`;
   after.innerHTML='<p style="text-align:center">見くらべて、まるつけしよう</p><div class="row"><button class="ok">⭕ 書けた</button><button class="ng">もういちど</button></div>';
   after.querySelector('.ok').onclick=()=>finish(true,it.k);after.querySelector('.ng').onclick=()=>finish(false,it.k)};
  begin();
 }else{
  body.innerHTML=`<div class="card"><div class="q">${it.w.split(it.k).join('<span class="t">□</span>')}</div><div>読み：${it.r}　□を正しい書きじゅんで書こう</div></div><div class="pad" id="hw"></div><div class="row"><button id="demo" disabled>お手本を見る</button></div>`;
  const el=body.querySelector('#hw'),demo=body.querySelector('#demo');msg.textContent='よみこみ中…';
  loadStrokes(it.k).then(ds=>{if(my!==token)return;msg.textContent='';let helped=false;
   const board=strokeBoard(el,ds,{outline:S.style=='ren',hintAfter:S.style=='ren'?1:3,onComplete:r=>{if(my!==token)return;demo.disabled=true;finish(!helped&&r.totalMistakes<=1,`まちがい ${r.totalMistakes}回${helped?'（お手本を見たよ）':''}`)}});
   demo.disabled=false;demo.onclick=()=>{if(done)return;helped=true;demo.disabled=true;board.demo(()=>demo.disabled=false)};
   begin();
  }).catch(()=>{if(my!==token||done)return;done=true;msg.textContent='書きじゅんデータをよみこめませんでした。ネットにつないで、公開したページで開いてください。';after.innerHTML='<button class="go">もどる</button>';after.firstChild.onclick=home});
 }
}
function draw(c,locked){
 const x=c.getContext('2d');let last;
 const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]};
 c.onpointerdown=e=>{if(locked())return;c.setPointerCapture(e.pointerId);last=pos(e)};
 c.onpointermove=e=>{if(!last)return;const p=pos(e);x.lineWidth=18;x.lineCap='round';x.strokeStyle='#23303f';x.beginPath();x.moveTo(...last);x.lineTo(...p);x.stroke();last=p};
 c.onpointerup=c.onpointercancel=()=>last=null;
}
function result(){
 token++;const ps=G.players,score=p=>p.time;let head='おつかれさま！';
 if(S.style=='turn'){const[a,b]=ps;head=score(a)==score(b)?'ひきわけ！':`${esc((score(a)<score(b)?a:b).name)}の勝ち！`}
 let rec='';
 if(S.style=='ta'){const key=`kanji-best:${S.kind}:${G.n}:${[...S.sel].sort().join('')}`,old=store.get(key,null),t=ps[0].time;
  if(old==null||t<old){store.set(key,t);rec='<p>🏆 しんきろく！</p>'}else rec=`<p>ベスト ${old.toFixed(1)}秒</p>`}
 const miss=[...new Set(ps.flatMap(p=>p.miss))];
 app.innerHTML=`<div class="card"><p class="q long">${head}</p>${ps.map(p=>`<p>${esc(p.name)}　${p.ok}/${G.n}もん${S.style!='ren'?`　<b>${p.time.toFixed(1)}秒</b>`:''}</p>`).join('')}${rec}</div>
 ${miss.length?`<div class="card"><b>つぎに育てることば</b>${miss.map(m=>`<p>${m.v?`${m.v[0]} → ${m.v[1]}`:`${m.w}（${m.r}）`}</p>`).join('')}</div>`:''}
 <button class="go" id="again">もういちど</button><p><button id="home" style="width:100%">はんいをえらびなおす</button></p>`;
 $('#again').onclick=start;$('#home').onclick=home;
}
function duel(){
 token++;const it=G.qs[G.i],c=choices(it,4),names=[0,1].map(i=>S.names[i]||`${i+1}人目`);
 const half=i=>`<div class="half ${i?'top':''}" data-p="${i}"><b>${esc(names[i])}　${G.score[i]}点</b>${qHTML(it)}<div class="ch">${c.list.map(x=>`<button>${x}</button>`).join('')}</div><div class="msg"></div></div>`;
 app.innerHTML=`<div class="duel">${half(1)}<div class="mid">${G.i+1}/${G.qs.length}　<button id="quit">やめる</button></div>${half(0)}</div>`;
 $('#quit').onclick=home;
 let over=false;const out=new Set;
 const end=()=>{over=true;app.querySelectorAll('.half').forEach(h=>h.querySelectorAll('.ch button').forEach(b=>{b.disabled=true;if(b.textContent==c.a){b.className='ok';b.style.opacity=1}}));
  later(()=>{if(++G.i<G.qs.length)return duel();const[a,b]=G.score;
   app.innerHTML=`<div class="card"><p class="q long">${a==b?'ひきわけ！':esc(names[a>b?0:1])+'の勝ち！'}</p><p>${esc(names[0])} ${a}点　／　${esc(names[1])} ${b}点</p></div><button class="go" id="again">もういちど</button><p><button id="home" style="width:100%">はじめにもどる</button></p>`;
   $('#again').onclick=start;$('#home').onclick=home},2200)};
 app.querySelectorAll('.half').forEach(h=>{const i=+h.dataset.p;h.querySelectorAll('.ch button').forEach(b=>b.onpointerdown=()=>{
  if(over||out.has(i))return;
  if(b.textContent==c.a){G.score[i]++;h.querySelector('.msg').textContent='⭕ 1点！';end()}
  else{out.add(i);b.className='ng';h.querySelector('.msg').textContent='おしい！このもんだいはお休み';h.querySelectorAll('.ch button').forEach(x=>x.disabled=true);if(out.size==2)end()}})});
}
home();
</script></body></html>
